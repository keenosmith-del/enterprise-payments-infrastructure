services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${EPI_KEYCLOAK_ADMIN:?set EPI_KEYCLOAK_ADMIN}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${EPI_KEYCLOAK_ADMIN_PASSWORD:?set EPI_KEYCLOAK_ADMIN_PASSWORD}"
      KC_HOSTNAME: "${EPI_KEYCLOAK_ISSUER_ORIGIN:-http://127.0.0.1:8180}"
    ports:
      - "127.0.0.1:${EPI_KEYCLOAK_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep '200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
