name: M01 foundation (in progress)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pytest tests/unit -q
      - run: ruff check packages tests/unit
      - run: mypy packages/epi_foundation tests/unit
  frontend-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
  migration-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Start disposable PostgreSQL and test migrations
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name epi-m01-pg -e POSTGRES_PASSWORD="$password" -p 127.0.0.1:55433:5432 postgres:17
          for attempt in $(seq 1 30); do
            if docker exec epi-m01-pg pg_isready -U postgres; then break; fi
            sleep 1
          done
          for db in policy_administration payments_hub banking_simulator payroll_simulator; do
            docker exec epi-m01-pg psql -U postgres -c "CREATE ROLE ${db}_owner NOLOGIN"
            docker exec epi-m01-pg psql -U postgres -c "CREATE ROLE ${db}_runtime NOLOGIN"
            docker exec epi-m01-pg createdb -U postgres -O "${db}_owner" "$db"
          done
          export EPI_TEST_BASE_URL="postgresql+psycopg://postgres:$password@127.0.0.1:55433"
          python -m pytest tests/integration/test_migrations.py -q
      - name: Remove disposable database
        if: always()
        run: docker rm -f epi-m01-pg || true
  database-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Test isolated database identities
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name epi-m01-boundaries -e POSTGRES_PASSWORD="$password" -p 127.0.0.1:55433:5432 postgres:17
          for attempt in $(seq 1 30); do
            if docker exec epi-m01-boundaries pg_isready -U postgres; then break; fi
            sleep 1
          done
          export EPI_BOOTSTRAP_DSN="host=127.0.0.1 port=55433 dbname=postgres user=postgres password=$password"
          for app in POLICY_ADMINISTRATION PAYMENTS_HUB BANKING_SIMULATOR PAYROLL_SIMULATOR; do
            for role in MIGRATION RUNTIME; do
              value="$(openssl rand -hex 24)"
              echo "::add-mask::$value"
              export "EPI_${app}_${role}_PASSWORD=$value"
            done
          done
          python -m pytest tests/integration/test_database_boundaries.py -v
      - name: Remove disposable database
        if: always()
        run: docker rm -f epi-m01-boundaries || true
  rabbit-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify restricted technical transport
        run: |
          export EPI_RABBIT_ADMIN=epi_admin
          export EPI_RABBIT_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$EPI_RABBIT_ADMIN_PASSWORD"
          for app in POLICY_ADMINISTRATION PAYMENTS_HUB BANKING_SIMULATOR PAYROLL_SIMULATOR INTEGRATION; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            export "EPI_RABBIT_${app}_PASSWORD=$value"
          done
          docker compose -p epi-m01-rabbit -f infrastructure/rabbitmq/compose.yaml up -d --wait
          python scripts/m01/bootstrap_rabbitmq.py
          python scripts/m01/bootstrap_rabbitmq.py
          python -m pytest tests/integration/test_rabbit_permissions.py -v
      - name: Clean up
        if: always()
        run: |
          if [[ -n "${EPI_RABBIT_ADMIN:-}" && -n "${EPI_RABBIT_ADMIN_PASSWORD:-}" ]]; then
            docker compose -p epi-m01-rabbit -f infrastructure/rabbitmq/compose.yaml down -v
          else
            docker rm -f epi-m01-rabbit-rabbitmq-1 || true
            docker volume rm epi-m01-rabbit_rabbit_data || true
          fi
  identity-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify real identity tokens
        run: |
          export EPI_KEYCLOAK_ADMIN=epi_admin
          export EPI_KEYCLOAK_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          export EPI_KEYCLOAK_USER_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$EPI_KEYCLOAK_ADMIN_PASSWORD"
          echo "::add-mask::$EPI_KEYCLOAK_USER_PASSWORD"
          docker compose -p epi-m01-identity -f infrastructure/identity/compose.yaml up -d
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8180/realms/master/.well-known/openid-configuration > /dev/null; then break; fi
            sleep 2
          done
          python scripts/m01/bootstrap_keycloak.py
          python -m pytest tests/integration/test_keycloak.py -v
      - name: Clean up
        if: always()
        run: docker rm -f epi-m01-identity-keycloak-1 || true
