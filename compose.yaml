services:
  postgres:
    mem_limit: ${EPI_POSTGRES_MEMORY_LIMIT:-512m}
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    environment:
      POSTGRES_PASSWORD: ${EPI_POSTGRES_ADMIN_PASSWORD:?generate local credentials}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
  database-setup:
    mem_limit: ${EPI_DATABASE_SETUP_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: payments-hub }
    command: ["python", "scripts/m01/prepare_databases.py"]
    environment:
      EPI_BOOTSTRAP_DSN: "host=postgres port=5432 dbname=postgres user=postgres password=${EPI_POSTGRES_ADMIN_PASSWORD:?generate local credentials}"
      EPI_POLICY_ADMINISTRATION_MIGRATION_PASSWORD: ${EPI_POLICY_ADMINISTRATION_MIGRATION_PASSWORD:?generate local credentials}
      EPI_POLICY_ADMINISTRATION_RUNTIME_PASSWORD: ${EPI_POLICY_ADMINISTRATION_RUNTIME_PASSWORD:?generate local credentials}
      EPI_PAYMENTS_HUB_MIGRATION_PASSWORD: ${EPI_PAYMENTS_HUB_MIGRATION_PASSWORD:?generate local credentials}
      EPI_PAYMENTS_HUB_RUNTIME_PASSWORD: ${EPI_PAYMENTS_HUB_RUNTIME_PASSWORD:?generate local credentials}
      EPI_BANKING_SIMULATOR_MIGRATION_PASSWORD: ${EPI_BANKING_SIMULATOR_MIGRATION_PASSWORD:?generate local credentials}
      EPI_BANKING_SIMULATOR_RUNTIME_PASSWORD: ${EPI_BANKING_SIMULATOR_RUNTIME_PASSWORD:?generate local credentials}
      EPI_PAYROLL_SIMULATOR_MIGRATION_PASSWORD: ${EPI_PAYROLL_SIMULATOR_MIGRATION_PASSWORD:?generate local credentials}
      EPI_PAYROLL_SIMULATOR_RUNTIME_PASSWORD: ${EPI_PAYROLL_SIMULATOR_RUNTIME_PASSWORD:?generate local credentials}
    depends_on:
      postgres: { condition: service_healthy }
  keycloak:
    mem_limit: ${EPI_KEYCLOAK_MEMORY_LIMIT:-1g}
    image: quay.io/keycloak/keycloak:26.3.5@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${EPI_KEYCLOAK_ADMIN:?generate local credentials}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${EPI_KEYCLOAK_ADMIN_PASSWORD:?generate local credentials}
      KC_HOSTNAME: http://127.0.0.1:8180
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8180:8080"
  identity-setup:
    mem_limit: ${EPI_IDENTITY_SETUP_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: payments-hub }
    command: ["sh", "-c", "python scripts/m01/wait_for_keycloak.py && python scripts/m01/bootstrap_keycloak.py"]
    environment:
      EPI_KEYCLOAK_ORIGIN: http://keycloak:8080
      EPI_KEYCLOAK_ADMIN: ${EPI_KEYCLOAK_ADMIN:?generate local credentials}
      EPI_KEYCLOAK_ADMIN_PASSWORD: ${EPI_KEYCLOAK_ADMIN_PASSWORD:?generate local credentials}
      EPI_KEYCLOAK_USER_PASSWORD: ${EPI_KEYCLOAK_USER_PASSWORD:?generate local credentials}
      EPI_KEYCLOAK_SERVICE_SECRET: ${EPI_KEYCLOAK_SERVICE_SECRET:?generate local credentials}
      EPI_KEYCLOAK_LIMITED_PASSWORD: ${EPI_KEYCLOAK_LIMITED_PASSWORD:?generate local credentials}
    depends_on:
      keycloak: { condition: service_started }
    restart: on-failure:10
  policy-administration-backend:
    mem_limit: ${EPI_POLICY_ADMINISTRATION_BACKEND_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: policy-administration }
    environment:
      EPI_DATABASE_URL: postgresql+psycopg://policy_administration_runtime:${EPI_POLICY_ADMINISTRATION_RUNTIME_PASSWORD:?generate local credentials}@postgres:5432/policy_administration
      EPI_OIDC_ISSUER: http://127.0.0.1:8180/realms/epi
      EPI_OIDC_AUDIENCE: policy-administration
      EPI_OIDC_JWKS_URL: http://keycloak:8080/realms/epi/protocol/openid-connect/certs
    depends_on:
      database-setup: { condition: service_completed_successfully }
      identity-setup: { condition: service_completed_successfully }
      rabbitmq-setup: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
  policy-administration-frontend:
    mem_limit: ${EPI_POLICY_ADMINISTRATION_FRONTEND_MEMORY_LIMIT:-128m}
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args: { APP_NAME: policy-administration }
    environment:
      EPI_BACKEND_HOST: policy-administration-backend
    depends_on:
      policy-administration-backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:5173:8080"
  payments-hub-backend:
    mem_limit: ${EPI_PAYMENTS_HUB_BACKEND_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: payments-hub }
    environment:
      EPI_DATABASE_URL: postgresql+psycopg://payments_hub_runtime:${EPI_PAYMENTS_HUB_RUNTIME_PASSWORD:?generate local credentials}@postgres:5432/payments_hub
      EPI_OIDC_ISSUER: http://127.0.0.1:8180/realms/epi
      EPI_OIDC_AUDIENCE: payments-hub
      EPI_OIDC_JWKS_URL: http://keycloak:8080/realms/epi/protocol/openid-connect/certs
    depends_on:
      database-setup: { condition: service_completed_successfully }
      identity-setup: { condition: service_completed_successfully }
      rabbitmq-setup: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
  payments-hub-frontend:
    mem_limit: ${EPI_PAYMENTS_HUB_FRONTEND_MEMORY_LIMIT:-128m}
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args: { APP_NAME: payments-hub }
    environment:
      EPI_BACKEND_HOST: payments-hub-backend
    depends_on:
      payments-hub-backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:5174:8080"
  banking-simulator-backend:
    mem_limit: ${EPI_BANKING_SIMULATOR_BACKEND_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: banking-simulator }
    environment:
      EPI_DATABASE_URL: postgresql+psycopg://banking_simulator_runtime:${EPI_BANKING_SIMULATOR_RUNTIME_PASSWORD:?generate local credentials}@postgres:5432/banking_simulator
      EPI_OIDC_ISSUER: http://127.0.0.1:8180/realms/epi
      EPI_OIDC_AUDIENCE: banking-simulator
      EPI_OIDC_JWKS_URL: http://keycloak:8080/realms/epi/protocol/openid-connect/certs
    depends_on:
      database-setup: { condition: service_completed_successfully }
      identity-setup: { condition: service_completed_successfully }
      rabbitmq-setup: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
  banking-simulator-frontend:
    mem_limit: ${EPI_BANKING_SIMULATOR_FRONTEND_MEMORY_LIMIT:-128m}
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args: { APP_NAME: banking-simulator }
    environment:
      EPI_BACKEND_HOST: banking-simulator-backend
    depends_on:
      banking-simulator-backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:5175:8080"
  payroll-simulator-backend:
    mem_limit: ${EPI_PAYROLL_SIMULATOR_BACKEND_MEMORY_LIMIT:-256m}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: payroll-simulator }
    environment:
      EPI_DATABASE_URL: postgresql+psycopg://payroll_simulator_runtime:${EPI_PAYROLL_SIMULATOR_RUNTIME_PASSWORD:?generate local credentials}@postgres:5432/payroll_simulator
      EPI_OIDC_ISSUER: http://127.0.0.1:8180/realms/epi
      EPI_OIDC_AUDIENCE: payroll-simulator
      EPI_OIDC_JWKS_URL: http://keycloak:8080/realms/epi/protocol/openid-connect/certs
    depends_on:
      database-setup: { condition: service_completed_successfully }
      identity-setup: { condition: service_completed_successfully }
      rabbitmq-setup: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
  payroll-simulator-frontend:
    mem_limit: ${EPI_PAYROLL_SIMULATOR_FRONTEND_MEMORY_LIMIT:-128m}
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args: { APP_NAME: payroll-simulator }
    environment:
      EPI_BACKEND_HOST: payroll-simulator-backend
    depends_on:
      payroll-simulator-backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:5176:8080"
  rabbitmq:
    mem_limit: ${EPI_RABBITMQ_MEMORY_LIMIT:-512m}
    image: rabbitmq:4.1-management@sha256:abcf6bc2eb4ff990bf041e605c485938739c5c98c513e0bc30a0ae9d0664be45
    environment:
      RABBITMQ_DEFAULT_USER: ${EPI_RABBIT_ADMIN:?generate local credentials}
      RABBITMQ_DEFAULT_PASS: ${EPI_RABBIT_ADMIN_PASSWORD:?generate local credentials}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
  rabbitmq-setup:
    mem_limit: ${EPI_RABBITMQ_SETUP_MEMORY_LIMIT:-512m}
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: payments-hub }
    command: ["python", "scripts/m01/bootstrap_rabbitmq.py"]
    environment:
      EPI_RABBIT_MANAGEMENT_URL: http://rabbitmq:15672/api
      EPI_RABBIT_ADMIN: ${EPI_RABBIT_ADMIN:?generate local credentials}
      EPI_RABBIT_ADMIN_PASSWORD: ${EPI_RABBIT_ADMIN_PASSWORD:?generate local credentials}
      EPI_RABBIT_POLICY_ADMINISTRATION_PASSWORD: ${EPI_RABBIT_POLICY_ADMINISTRATION_PASSWORD:?generate local credentials}
      EPI_RABBIT_PAYMENTS_HUB_PASSWORD: ${EPI_RABBIT_PAYMENTS_HUB_PASSWORD:?generate local credentials}
      EPI_RABBIT_BANKING_SIMULATOR_PASSWORD: ${EPI_RABBIT_BANKING_SIMULATOR_PASSWORD:?generate local credentials}
      EPI_RABBIT_PAYROLL_SIMULATOR_PASSWORD: ${EPI_RABBIT_PAYROLL_SIMULATOR_PASSWORD:?generate local credentials}
      EPI_RABBIT_INTEGRATION_PASSWORD: ${EPI_RABBIT_INTEGRATION_PASSWORD:?generate local credentials}
    depends_on:
      rabbitmq: { condition: service_healthy }
  enterprise-integration:
    mem_limit: ${EPI_ENTERPRISE_INTEGRATION_MEMORY_LIMIT:-256m}
    profiles: [integration]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: payments-hub }
    command: ["python", "services/enterprise-integration/technical_probe.py"]
    environment:
      EPI_RABBIT_HOST: rabbitmq
      EPI_RABBIT_INTEGRATION_PASSWORD: ${EPI_RABBIT_INTEGRATION_PASSWORD:?generate local credentials}
    depends_on:
      rabbitmq-setup: { condition: service_completed_successfully }
  sftp:
    mem_limit: ${EPI_SFTP_MEMORY_LIMIT:-128m}
    profiles: [sftp]
    build:
      context: ./scripts/m00/sftp
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - type: bind
        source: ./.local/sftp/input
        target: /probe-keys-input
        read_only: true
      - sftp_partner_a:/srv/sftp/partner_a/inbox
      - sftp_partner_b:/srv/sftp/partner_b/inbox
  data-engineering:
    mem_limit: ${EPI_DATA_ENGINEERING_MEMORY_LIMIT:-512m}
    profiles: [analytics]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args: { APP_NAME: payments-hub }
    command: ["python", "services/data-engineering/technical_smoke.py"]
  prometheus:
    mem_limit: ${EPI_PROMETHEUS_MEMORY_LIMIT:-256m}
    profiles: [observability]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
  grafana:
    mem_limit: ${EPI_GRAFANA_MEMORY_LIMIT:-384m}
    profiles: [observability]
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${EPI_GRAFANA_PASSWORD:?generate local credentials}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
volumes:
  postgres_data:
  grafana_data:
  rabbit_data:
  keycloak_data:
  sftp_partner_a:
  sftp_partner_b:
